name: safeharness-m4
services:
  postgres:
    image: postgres@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    env_file: ../artifacts/m4-private/postgres.env
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safeharness -d safeharness"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
