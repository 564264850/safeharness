<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BudgetBook 记账本</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f7fa;color:#1f2933}
header{padding:20px 16px;background:#fff;border-bottom:1px solid #e3e8ef}
h1{margin:0 0 4px;font-size:20px}
.sub{margin:0;color:#66788a;font-size:13px}
main{max-width:860px;margin:0 auto;padding:16px;display:grid;gap:14px}
.card{background:#fff;border:1px solid #e3e8ef;border-radius:10px;padding:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:#f0f6ff;border-radius:8px;padding:10px}
.stat b{display:block;font-size:20px;color:#1a56db}
.stat span{font-size:12px;color:#66788a}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;align-items:end}
label{display:flex;flex-direction:column;font-size:12px;color:#66788a;gap:4px}
input,select,button{font:inherit;padding:8px;border:1px solid #cbd5e1;border-radius:6px;background:#fff}
button{cursor:pointer;background:#1a56db;color:#fff;border-color:#1a56db}
button.ghost{background:#fff;color:#1a56db}
button.del{background:#fff;color:#c81e1e;border-color:#f3c4c4;padding:4px 8px;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #eef2f7;word-break:break-word}
th{font-size:12px;color:#66788a;font-weight:600}
.msg{font-size:13px;color:#66788a}
.msg.err{color:#c81e1e}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
@media(max-width:560px){th:nth-child(5),td:nth-child(5){display:none}}
</style>
</head>
<body>
<header>
<h1>BudgetBook 记账本</h1>
<p class="sub">本地个人支出记录，数据保存在本机 JSON 文件中。</p>
</header>
<main>
<section class="card stats">
<div class="stat"><b id="total">—</b><span>总支出</span></div>
<div class="stat"><b id="count">—</b><span>记录数</span></div>
<div class="stat"><b id="cats">—</b><span>分类汇总</span></div>
</section>
<section class="card">
<form id="form">
<label>金额<input id="amount" inputmode="decimal" placeholder="12.30" required></label>
<label>分类<input id="category" placeholder="餐饮" required></label>
<label>日期<input id="date" type="date"></label>
<label>备注<input id="note" placeholder="可选"></label>
<button type="submit">添加记录</button>
</form>
<p class="msg" id="formMsg"></p>
</section>
<section class="card">
<div class="row">
<label>月份<input id="month" type="month"></label>
<label>分类<input id="filterCat" placeholder="全部"></label>
<button class="ghost" id="apply" type="button">筛选</button>
<button class="ghost" id="reset" type="button">重置</button>
<button class="ghost" id="export" type="button">下载 CSV</button>
</div>
<p class="msg" id="listMsg">加载中…</p>
<table>
<thead><tr><th>日期</th><th>分类</th><th>金额</th><th>备注</th><th>操作</th></tr></thead>
<tbody id="rows"></tbody>
</table>
</section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const state = { month: "", category: "" };

function setMsg(el, text, isErr) {
  el.textContent = text || "";
  el.className = "msg" + (isErr ? " err" : "");
}

async function api(path, options) {
  const res = await fetch(path, options);
  const type = res.headers.get("Content-Type") || "";
  const data = type.includes("json") ? await res.json() : await res.text();
  if (!res.ok) throw new Error((data && data.error) || "请求失败");
  return data;
}

function query() {
  const p = new URLSearchParams();
  if (state.month) p.set("month", state.month);
  if (state.category) p.set("category", state.category);
  const s = p.toString();
  return s ? "?" + s : "";
}

function renderSummary(sum) {
  $("total").textContent = "¥" + sum.total;
  $("count").textContent = String(sum.count);
  const keys = Object.keys(sum.by_category);
  $("cats").textContent = keys.length
    ? keys.map((k) => k + " " + sum.by_category[k]).join(" / ")
    : "暂无";
}

function renderRows(rows) {
  const body = $("rows");
  body.textContent = "";
  for (const row of rows) {
    const tr = document.createElement("tr");
    for (const value of [row.date, row.category, "¥" + row.amount, row.note]) {
      const td = document.createElement("td");
      td.textContent = value;
      tr.appendChild(td);
    }
    const td = document.createElement("td");
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "del";
    btn.textContent = "删除";
    btn.addEventListener("click", () => remove(row.id));
    td.appendChild(btn);
    tr.appendChild(td);
    body.appendChild(tr);
  }
}

async function refresh() {
  setMsg($("listMsg"), "加载中…");
  try {
    const [rows, sum] = await Promise.all([
      api("/api/entries" + query()),
      api("/api/summary" + (state.month ? "?month=" + encodeURIComponent(state.month) : "")),
    ]);
    renderSummary(sum);
    renderRows(rows);
    setMsg($("listMsg"), rows.length ? "共 " + rows.length + " 条记录" : "暂无记录，先添加一条吧。");
  } catch (err) {
    setMsg($("listMsg"), "加载失败：" + err.message, true);
  }
}

async function remove(id) {
  if (!confirm("确定删除这条记录吗？")) return;
  try {
    await api("/api/entries/" + id, { method: "DELETE" });
    await refresh();
  } catch (err) {
    setMsg($("listMsg"), "删除失败：" + err.message, true);
  }
}

$("form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const body = {
    amount: $("amount").value.trim(),
    category: $("category").value.trim(),
    note: $("note").value,
  };
  if ($("date").value) body.date = $("date").value;
  try {
    await api("/api/entries", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    $("amount").value = "";
    $("note").value = "";
    setMsg($("formMsg"), "已保存");
    await refresh();
  } catch (err) {
    setMsg($("formMsg"), "保存失败：" + err.message, true);
  }
});

$("apply").addEventListener("click", () => {
  state.month = $("month").value;
  state.category = $("filterCat").value.trim();
  refresh();
});
$("reset").addEventListener("click", () => {
  $("month").value = "";
  $("filterCat").value = "";
  state.month = "";
  state.category = "";
  refresh();
});
$("export").addEventListener("click", () => {
  window.location.href = "/api/export";
});

refresh();
</script>
</body>
</html>
